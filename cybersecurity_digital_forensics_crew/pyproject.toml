[project]
name = "cybersecurity_digital_forensics_crew"
version = "0.1.0"
description = "cybersecurity_digital_forensics_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.0"
]

[project.scripts]
cybersecurity_digital_forensics_crew = "cybersecurity_digital_forensics_crew.main:run"
run_crew = "cybersecurity_digital_forensics_crew.main:run"
train = "cybersecurity_digital_forensics_crew.main:train"
replay = "cybersecurity_digital_forensics_crew.main:replay"
test = "cybersecurity_digital_forensics_crew.main:test"
run_with_trigger = "cybersecurity_digital_forensics_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
