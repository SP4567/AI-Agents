research_task:
  description: >
    Conduct a thorough research about {topic}
    Make sure you find any interesting and relevant information given
    the current year is {current_year}.
  expected_output: >
    A list with 10 bullet points of the most relevant information about {topic} in 2000 words.
  agent: researcher

blog_task:
  description: >
    Review the context you got and expand each topic into a full section for a blog post.
    Make sure the blog post is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged blog post with the main topics, each with a full section of information in 2000 words.
    Formatted as markdown without '```'
  agent: blog_writer
